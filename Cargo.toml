[package]
name = "noctalia-lyrics"
description = "Helper for Noctalia lyric plugins"
repository = "https://github.com/surumeika1987/noctalia-lyrics-helper"
version = "0.1.0"
authors = ["surumeika1987"]
edition = "2024"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"
dirs = "7"
md-5 = "0.11"
hex = "0.4"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
